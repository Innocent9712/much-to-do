apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-configmap
  namespace: muchtodo
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: muchtodo-application
data:
  MONGO_INITDB_DATABASE: "much_todo_db"
  MONGO_HOST: "mongodb-service"
  MONGO_PORT: "27017"
