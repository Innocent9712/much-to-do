apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: muchtodo
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: muchtodo-application
type: Opaque
# Note: In production, use sealed-secrets or external secret management
# Values are base64 encoded: echo -n 'value' | base64
data:
  # super-secret-jwt-key-for-muchtodo-app (base64 encoded)
  JWT_SECRET_KEY: c3VwZXItc2VjcmV0LWp3dC1rZXktZm9yLW11Y2h0b2RvLWFwcA==
  # root (base64 encoded) - must match mongodb secret
  MONGO_USER: cm9vdA==
  # mongopassword123 (base64 encoded) - must match mongodb secret
  MONGO_PASSWORD: bW9uZ29wYXNzd29yZDEyMw==
