version: '3.8'

services:
  backend:
    build: .
    container_name: much-to-do-backend
    ports:
      - "8080:8080"
    environment:
      MONGO_URI: mongodb://mongo:27017
      DB_NAME: muchtodo
    depends_on:
      - mongo

  mongo:
    image: mongo:6
    container_name: much-to-do-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: