name: Backend CI/CD

on:
  push:
    branches: [master, feature/containers]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci-cd.yml'
  pull_request:
    branches: [master]
    paths:
      - 'backend/**'

concurrency:
  group: backend-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.3'
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  ASG_NAME: ${{ vars.ASG_NAME }}
  ALB_DNS_NAME: ${{ vars.ALB_DNS_NAME }}
  # Database (Secrets)
  MONGO_URI: ${{ secrets.BACKEND_MONGO_URI }}
  # Application Configuration (Secrets & Variables)
  JWT_SECRET_KEY: ${{ secrets.BACKEND_JWT_SECRET_KEY }}
  DB_NAME: ${{ vars.BACKEND_DB_NAME || 'much_todo_db' }}
  JWT_EXPIRATION_HOURS: ${{ vars.BACKEND_JWT_EXPIRATION_HOURS || '72' }}
  ENABLE_CACHE: ${{ vars.BACKEND_ENABLE_CACHE || 'true' }}
  LOG_LEVEL: ${{ vars.BACKEND_LOG_LEVEL || 'INFO' }}
  LOG_FORMAT: ${{ vars.BACKEND_LOG_FORMAT || 'json' }}

jobs:
  test:
    name: Test & Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Install Dependencies
        working-directory: ./backend
        run: go mod download

      - name: Install Swag (Swagger CLI)
        run: go install github.com/swaggo/swag/cmd/swag@v1.16.6

      - name: Generate Swagger Docs
        working-directory: ./backend
        run: $(go env GOPATH)/bin/swag init -g ./cmd/api/main.go -o ./docs

      - name: Run Unit Tests
        working-directory: ./backend
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Code Quality - go vet
        working-directory: ./backend
        run: go vet ./...
         
      - name: Code Quality - Staticcheck
        working-directory: ./backend
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

      - name: Security Scan - Gosec
        uses: securego/gosec@master
        with:
          args: '-fmt sarif -out gosec.sarif -no-fail ./...'
          workdir: ./backend

      - name: Upload Security Scan
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan
          path: backend/gosec.sarif

  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master'
    permissions:
      id-token: write
      contents: read
      security-events: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        working-directory: ./backend
        run: |
          IMAGE_TAG=$(echo ${{ github.sha }} | cut -c1-7)
          docker build \
            --build-arg GO_VERSION=${{ env.GO_VERSION }} \
            --build-arg MONGO_URI="${{ env.MONGO_URI }}" \
            --build-arg DB_NAME="${{ env.DB_NAME }}" \
            --build-arg JWT_SECRET_KEY="${{ env.JWT_SECRET_KEY }}" \
            --build-arg JWT_EXPIRATION_HOURS="${{ env.JWT_EXPIRATION_HOURS }}" \
            --build-arg ENABLE_CACHE="${{ env.ENABLE_CACHE }}" \
            --build-arg LOG_LEVEL="${{ env.LOG_LEVEL }}" \
            --build-arg LOG_FORMAT="${{ env.LOG_FORMAT }}" \
            -t ${{ env.ECR_REPOSITORY }}:latest \
            -t ${{ env.ECR_REPOSITORY }}:$IMAGE_TAG .

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.ECR_REPOSITORY }}:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'



      - name: Push to ECR
        run: |
          IMAGE_TAG=$(echo ${{ github.sha }} | cut -c1-7)
          docker push ${{ env.ECR_REPOSITORY }}:latest
          docker push ${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_ENV

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    environment: production
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Trigger Rolling Update
        run: |
          echo "Checking for in-progress instance refreshes..."
          STATUS=$(aws autoscaling describe-instance-refreshes \
            --auto-scaling-group-name ${{ env.ASG_NAME }} \
            --query 'InstanceRefreshes[0].Status' --output text)
          
          if [ "$STATUS" == "InProgress" ] || [ "$STATUS" == "Pending" ]; then
            echo "A refresh is already in progress ($STATUS). Cancelling it to start a new one..."
            aws autoscaling cancel-instance-refresh --auto-scaling-group-name ${{ env.ASG_NAME }}
            
            # Small sleep to allow AWS to process the cancellation
            sleep 10
          fi

          echo "Starting new instance refresh..."
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name ${{ env.ASG_NAME }} \
            --strategy Rolling \
            --preferences MinHealthyPercentage=50,InstanceWarmup=300 \
            --query 'InstanceRefreshId'

      - name: Wait for Instance Refresh
        run: |
          REFRESH_ID=$(aws autoscaling describe-instance-refreshes \
            --auto-scaling-group-name ${{ env.ASG_NAME }} \
            --query 'InstanceRefreshes[0].InstanceRefreshId' \
            --output text)
          
          echo "Waiting for instance refresh: $REFRESH_ID"
          
          while true; do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name ${{ env.ASG_NAME }} \
              --instance-refresh-ids $REFRESH_ID \
              --query 'InstanceRefreshes[0].Status' \
              --output text)
            
            echo "Status: $STATUS"
            
            if [ "$STATUS" == "Successful" ]; then
              echo "Instance refresh completed successfully"
              break
            elif [ "$STATUS" == "Failed" ] || [ "$STATUS" == "Cancelled" ]; then
              echo "Instance refresh failed"
              exit 1
            fi
            
            sleep 30
          done

      - name: Smoke Tests
        run: |
          ALB_URL=${{ env.ALB_DNS_NAME }}
          MAX_RETRIES=10
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            RESPONSE=$(curl -sf http://$ALB_URL/health || echo "FAIL")
            if [ "$RESPONSE" != "FAIL" ]; then
              echo "Health check passed"
              echo "Response: $RESPONSE"
              break
            fi
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Attempt $RETRY_COUNT failed, retrying..."
            sleep 10
          done
          
          if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
            echo "Smoke tests failed after $MAX_RETRIES attempts"
            exit 1
          fi

      - name: Configure CloudWatch Alarms
        run: |
          TG_ARN="${{ secrets.TARGET_GROUP_ARN }}"
          if [ -z "$TG_ARN" ]; then
            echo "TARGET_GROUP_ARN secret is empty, resolving dynamically from ASG: ${{ env.ASG_NAME }}..."
            TG_ARN=$(aws autoscaling describe-auto-scaling-groups \
              --auto-scaling-group-names ${{ env.ASG_NAME }} \
              --query 'AutoScalingGroups[0].TargetGroupARNs[0]' \
              --output text)
            
            if [ -z "$TG_ARN" ] || [ "$TG_ARN" == "None" ]; then
              echo "Error: Could not resolve Target Group ARN"
              exit 1
            fi
            echo "Resolved Target Group ARN: $TG_ARN"
          fi
          
          TG_SUFFIX=$(echo "$TG_ARN" | sed 's|.*:targetgroup/|targetgroup/|')
          aws cloudwatch put-metric-alarm \
            --alarm-name starttech-backend-health-check \
            --metric-name HealthyHostCount \
            --namespace AWS/ApplicationELB \
            --statistic Average \
            --period 60 \
            --evaluation-periods 2 \
            --threshold 1 \
            --comparison-operator LessThanThreshold \
            --dimensions Name=TargetGroup,Value=$TG_SUFFIX